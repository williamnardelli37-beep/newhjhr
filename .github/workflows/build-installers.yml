name: Build NODO desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows e Linux: processadores Intel/AMD (x64 / x86_64).
          - os: windows-latest
            qt_arch: win64_msvc2022_64
            artifact: NODO-Windows-x64
            cmake_args: ''
          # macOS: UM app universal (Intel x86_64 + Apple Silicon arm64). O Qt "clang_64" oficial e universal.
          - os: macos-15
            qt_arch: clang_64
            artifact: NODO-macOS-universal
            cmake_args: '-DNODO_MAC_ARCH=universal'
          - os: ubuntu-22.04
            qt_arch: gcc_64
            artifact: NODO-Linux-x86_64
            cmake_args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4.3.0
        with:
          version: '6.8.3'
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: 'desktop'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNODO_BUILD_GUI=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Confirmar que o app do Mac tem Intel e Apple Silicon
        if: runner.os == 'macOS'
        run: |
          archs="$(lipo -archs build/Nodo.app/Contents/MacOS/Nodo)"
          echo "Arquiteturas: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "App nao e universal"; exit 1;; esac
      - name: Package
        shell: bash
        run: |
          cd build
          cpack -C Release
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/*.dmg
            build/*.pkg
            build/*.zip
            build/*.deb
            build/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List release files
        run: ls -lah release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NODO ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.pkg
            release-assets/*.zip
            release-assets/*.deb
            release-assets/*.tar.gz
